plugins {
    id "fabric-loom" version "1.7-SNAPSHOT"
}

base.archivesName.set("${mod_id}-fabric")

loom {
    accessWidenerPath = project(":Common").file("src/main/resources/${project.mod_id}.accesswidener")

    mixin {
        defaultRefmapName.set("${project.mod_id}.refmap.json")
    }

    runs {
        client {
            client()
            setConfigName("[Fabric] Client")
            ideConfigGenerated(true)
            runDir("run")
        }

        server {
            server()
            setConfigName("[Fabric] Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    compileOnly project(":Common")
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "com.github.glitchfiend:TerraBlender-fabric:${project.minecraft_version}-${project.terrablender_version}"
}

processResources {
    from project(":Common").sourceSets.main.resources
}

tasks.withType(JavaCompile) {
    source(project(":Common").sourceSets.main.allSource)
}