buildscript {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net'
        }
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'idea'
    apply plugin: 'maven-publish'

    version = "${minecraft_version}-${mod_version}"

    java.toolchain.languageVersion = JavaLanguageVersion.of(17)
    java.withSourcesJar()

    repositories {
        mavenCentral()
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net'
        }
        maven {
            name = 'Sponge Mixin'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        maven {
            name = "ModMaven"
            url = "https://modmaven.dev"
        }
        maven {
            name = "Jared's Maven"
            url = "https://maven.blamejared.com/"
        }
    }

    processResources {
        var replaceProperties = [
                minecraft_version: minecraft_version,
                forge_version: forge_version, forge_version_range: forge_version_range, forge_loader_version_range: forge_loader_version_range,
                fabric_loader_version: fabric_loader_version, fabric_api_version: fabric_api_version,
                terrablender_version: terrablender_version,
                mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, mod_license: mod_license,
                mod_page_url: mod_page_url, mod_github_url: mod_github_url, mod_issues_url: mod_issues_url,
                mod_authors: mod_authors, mod_description: mod_description,
        ]
        inputs.properties replaceProperties

        filesMatching(['pack.mcmeta', 'META-INF/mods.toml', 'fabric.mod.json', '*.mixins.json']) {
            expand replaceProperties + [project: project]
        }
    }

    tasks.named('jar', Jar).configure {
        manifest {
            attributes([
                    'Specification-Title'     : mod_id,
                    'Specification-Vendor'    : mod_authors,
                    'Specification-Version'   : '1',
                    'Implementation-Title'    : project.name,
                    'Implementation-Version'  : project.jar.archiveVersion,
                    'Implementation-Vendor'   : mod_authors,
                    'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
            ])
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.release.set(17)
    }

    tasks.withType(GenerateModuleMetadata) {
        enabled = false
    }
}